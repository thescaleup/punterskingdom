<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PUNTERS KINGDOM | Official Channel</title>
<style>
  :root{
    --bg-1:#0b0620;
    --bg-2:#150a2e;
    --card-bg: rgba(30, 18, 55, 0.55);
    --card-border: rgba(180, 140, 255, 0.35);
    --violet: #8b5cf6;
    --magenta: #ec4899;
    --blue: #3b82f6;
    --text-main: #ffffff;
    --text-soft: rgba(255,255,255,0.65);
    --pill-border: #b48cff;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    min-height:100%;
    background: radial-gradient(circle at 20% 10%, rgba(139,92,246,0.35), transparent 45%),
                radial-gradient(circle at 85% 15%, rgba(236,72,153,0.28), transparent 45%),
                radial-gradient(circle at 15% 85%, rgba(59,130,246,0.30), transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(139,92,246,0.25), transparent 45%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px 40px;
  }

  /* ambient floating glow blobs for extra depth/motion */
  .glow-blob{
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events:none;
    z-index:0;
    opacity:0.55;
  }
  .glow-1{
    width: 320px; height: 320px;
    background: var(--violet);
    top: -80px; left: -80px;
    animation: float1 9s ease-in-out infinite;
  }
  .glow-2{
    width: 280px; height: 280px;
    background: var(--magenta);
    bottom: -60px; right: -60px;
    animation: float2 11s ease-in-out infinite;
  }
  .glow-3{
    width: 240px; height: 240px;
    background: var(--blue);
    top: 40%; right: -100px;
    animation: float1 13s ease-in-out infinite;
  }

  @keyframes float1{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(20px,30px); }
  }
  @keyframes float2{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-25px,-20px); }
  }

  .card{
    position:relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 36px 26px 32px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 20px 60px rgba(0,0,0,0.45),
      0 0 80px rgba(139,92,246,0.15);
    text-align:center;
    animation: cardIn 0.7s ease-out;
  }

  @keyframes cardIn{
    from{ opacity:0; transform: translateY(16px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .avatar-wrap{
    width: 128px;
    height: 128px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--magenta), var(--violet), var(--blue));
    box-shadow: 0 0 30px rgba(139,92,246,0.55), 0 0 60px rgba(236,72,153,0.25);
    animation: pulseGlow 3.2s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%,100%{ box-shadow: 0 0 25px rgba(139,92,246,0.5), 0 0 50px rgba(236,72,153,0.2); }
    50%{ box-shadow: 0 0 40px rgba(139,92,246,0.75), 0 0 75px rgba(236,72,153,0.35); }
  }

  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit: cover;
    border-radius: 50%;
    display:block;
    border: 3px solid rgba(10,5,25,0.9);
  }

  h1.brand{
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.15;
    margin-bottom: 14px;
    text-shadow: 0 0 20px rgba(139,92,246,0.5);
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #d9c9ff;
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 7px 18px;
    margin-bottom: 26px;
    box-shadow: 0 0 16px rgba(180,140,255,0.25) inset, 0 0 12px rgba(180,140,255,0.15);
  }

  .pill .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background: #a78bfa;
    box-shadow: 0 0 8px #a78bfa;
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  .stats{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 22px;
  }

  .stat{
    flex:1;
  }

  .stat .num{
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
  }

  .stat .label{
    font-size: 10.5px;
    letter-spacing: 1px;
    color: var(--text-soft);
    font-weight: 600;
  }

  .divider{
    height:1px;
    width:100%;
    background: linear-gradient(90deg, transparent, rgba(180,140,255,0.4), transparent);
    margin-bottom: 22px;
  }

  .features{
    display:flex;
    flex-direction:column;
    gap: 14px;
    margin-bottom: 28px;
    text-align:left;
  }

  .feature{
    display:flex;
    align-items:center;
    gap: 12px;
    font-size: 14px;
    font-weight: 500;
    color: #f1eafe;
  }

  .feature .icon{
    flex-shrink:0;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1.4px solid rgba(255,255,255,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.03);
  }

  .feature .icon svg{
    width: 17px;
    height: 17px;
    stroke: #ffffff;
    fill: none;
  }

  .cta-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    width:100%;
    padding: 17px 20px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #ffffff;
    text-decoration:none;
    background: linear-gradient(115deg, #ec4899, #8b5cf6 50%, #3b82f6);
    background-size: 220% 220%;
    box-shadow: 0 0 25px rgba(236,72,153,0.45), 0 0 45px rgba(139,92,246,0.4), 0 10px 30px rgba(0,0,0,0.35);
    animation: shine 3.5s linear infinite, breathe 2.4s ease-in-out infinite;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .cta-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width: 60%;
    height:100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    animation: sweep 2.8s ease-in-out infinite;
  }

  @keyframes sweep{
    0%{ left: -150%; }
    60%{ left: 150%; }
    100%{ left: 150%; }
  }

  @keyframes shine{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  @keyframes breathe{
    0%,100%{ transform: scale(1); box-shadow: 0 0 25px rgba(236,72,153,0.45), 0 0 45px rgba(139,92,246,0.4), 0 10px 30px rgba(0,0,0,0.35); }
    50%{ transform: scale(1.015); box-shadow: 0 0 34px rgba(236,72,153,0.6), 0 0 60px rgba(139,92,246,0.55), 0 10px 30px rgba(0,0,0,0.35); }
  }

  .cta-btn:active{
    transform: scale(0.97);
  }

  .cta-btn svg{
    width: 20px;
    height:20px;
    fill: #ffffff;
    flex-shrink:0;
  }

  footer{
    margin-top: 22px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    text-align:center;
    letter-spacing: 0.3px;
  }

  @media (max-width: 380px){
    .card{ padding: 30px 20px 26px; }
    h1.brand{ font-size: 26px; }
    .avatar-wrap{ width: 108px; height:108px; }
  }

  @media (min-width: 520px){
    .card{ max-width: 460px; padding: 44px 40px 38px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; }
  }
</style>
</head>
